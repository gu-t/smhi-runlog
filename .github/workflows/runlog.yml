name: SMHI run log

# Each run checks SMHI every 5 minutes for about 50 minutes and then starts the next run itself, so the
# log doesn't depend on GitHub's scheduler (which never started this workflow on time). The hourly
# schedule only restarts the chain if it breaks; the concurrency group keeps runs one at a time.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # Commit the log.
  actions: write    # Start the next run, and disable this workflow when the 48 hours are over.

concurrency:
  group: runlog
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Check SMHI every 5 minutes for 50 minutes
        id: loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 50 * 60 ))
          while true; do
            out=$(python3 runlog.py) || out="ERROR"
            echo "$(date -u +%H:%M:%S) $out"
            if [ "$out" = "DONE" ]; then
              echo "done=true" >> "$GITHUB_OUTPUT"
              gh workflow disable runlog.yml --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Log $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase && git push -q || echo "push failed"
            fi
            if [ $(( $(date +%s) + 300 )) -gt "$end" ]; then break; fi
            sleep 300
          done

      - name: Start the next run
        if: always() && steps.loop.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run runlog.yml --repo "$GITHUB_REPOSITORY" --ref main
